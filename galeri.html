<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri — Bintang Menggala</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Plus+Jakarta+Sans:wght@300;400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container">
            <h1>GALERI</h1>
            <p>A few moments from Bintang Menggala</p>

            <nav class="header-nav" aria-label="Navigasi utama">
                <a href="index.html" class="btn-nav">Profil</a>
                <span class="nav-divider" aria-hidden="true"></span>
                <a href="https://bintangmenggala0-creator.github.io/PKL-BINTANG/" class="btn-nav" target="_blank" rel="noopener noreferrer">Dokumentasi PKL</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="gallery-section">
            <div class="gallery-grid" id="profile-gallery"></div>
        </section>
    </main>

    <div id="lightbox" class="lightbox-overlay">
        <div class="lightbox-container">
            <span id="lightbox-close" class="lightbox-close">&times;</span>
            <img id="lightbox-img" class="lightbox-img" src="" alt="Fullscreen Image">
            <div class="lightbox-caption">
                <h3 id="lightbox-title"></h3>
                <p id="lightbox-desc"></p>
            </div>
        </div>
    </div>

    <footer>
        <p>2026 Bintang Menggala.</p>
    </footer>

    <script src="data-gallery.js"></script>
    <script src="script.js"></script>
</body>
</html>
